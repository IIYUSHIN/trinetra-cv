# IMP-0002 - Python 3.12 project metadata and dependency groups.
#
# This file is the human-readable dependency CONTRACT. The exact resolved
# graph is uv.lock, which is introduced and policed by IMP-0003 and must never
# be hand-edited. Every requirement below is a bounded range from PyPI; no
# VCS, URL or path requirements are allowed (enforced by
# tests/foundation/test_imp0002_project_metadata.py).
#
# Lock policy (IMP-0003): uv.lock is generated by `uv lock`, never edited by
# hand, must be committed and un-ignored, may only reference the PyPI registry,
# and must carry sha256 hashes for every artifact.
#
# Layering rules this file encodes (Bible 13814-13846, 13999-14026):
#   * The Core runtime has no web framework and no ML stack. `dependencies`
#     stays minimal; everything else is an opt-in extra.
#   * FastAPI is transport only -> extra `api`, never imported by domain code.
#   * torch/torchvision/onnxruntime run only inside the hostile Runner image
#     -> extra `runner-ml`, never in the Core environment.
#   * No cloud, telemetry, LLM, blockchain or Ultralytics-only dependency.
#
# Licenses of direct dependencies were read from PyPI metadata on 2026-10-31
# (pydantic MIT, sqlalchemy MIT, alembic MIT, fastapi MIT, uvicorn BSD-3,
# cbor2 MIT, cryptography Apache-2.0 OR BSD-3, numpy BSD-3 (+bundled terms),
# pillow MIT-CMU, onnxruntime MIT, torch BSD-style/Apache-2.0 components,
# torchvision BSD). hypothesis is MPL-2.0 and is a dev-only dependency that is
# never redistributed. This is NOT a completed D40 license review.

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "trinetra-cv"
version = "0.0.0.dev0"
description = "Offline, evidence-bound computer-vision assurance workstation (pre-release foundation)."
requires-python = ">=3.12,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
persistence = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
crypto = [
    "cbor2>=5.6,<7",
    "cryptography>=43,<51",
]
imaging = [
    "numpy>=2.1,<3",
    "pillow>=10.4,<14",
]
runner-ml = [
    "numpy>=2.1,<3",
    "pillow>=10.4,<14",
    "onnxruntime>=1.19,<2",
    # torch/torchvision are DEFERRED (IMP-0003 blocker): PyPI's Linux torch wheel
    # drags in ~15 nvidia-* CUDA packages, which violates "CPU mandatory, no
    # hidden CUDA" (Bible 14905-14907), and the CPU-only wheel index was not
    # reachable from the build sandbox. Re-add together with an explicit
    # [[tool.uv.index]] CPU source once a lock can be produced and verified.
]

[dependency-groups]
test = [
    "pytest>=8.3,<10",
    "hypothesis>=6.112,<7",
    "packaging>=24.1,<27",
]
lint = [
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
required-version = ">=0.11"
# Re-resolution can only see packages published on or before this instant, so a
# later `uv lock` cannot silently drift. Bump deliberately, in its own commit.
exclude-newer = "2026-10-31T00:00:00Z"

[tool.uv.build-backend]
# Src layout from Bible 134-155: the importable package is backend/src/trinetra.
module-root = "backend/src"
module-name = "trinetra"

# ---------------------------------------------------------------------------
# Quality configuration (IMP-0011). Everything is explicit on purpose: Ruff's
# *built-in* default rule set changes between releases, so relying on it would
# make lint results differ between machines and over time. The tool versions
# are pinned by uv.lock; bump them (and review the rule diff) in their own commit.
# ---------------------------------------------------------------------------
[tool.ruff]
required-version = ">=0.17,<0.18"
target-version = "py312"
line-length = 110
src = ["backend/src", "tests"]
fix = false

[tool.ruff.lint]
# Families chosen for a security-sensitive, offline, hostile-input codebase:
# pyflakes/pycodestyle/isort, bugbear, pyupgrade, simplify, pytest style,
# logging-format, bandit (S), blind-except, naive-datetime (DTZ), print (T20),
# pylint, tryceratops, perflint, refurb, Ruff-specific, async and naming.
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM", "PT", "G", "ISC", "TRY", "RUF", "PL", "S",
    "BLE", "DTZ", "T20", "PIE", "A", "ARG", "RET", "PERF", "FURB", "LOG", "PGH", "N", "ASYNC",
]
ignore = [
    "TRY003",   # long messages inside exception constructors are the project convention
    "PLR2004",  # magic-number comparisons: protocol constants are named where they matter
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # size heuristics; reviewed by humans instead
]

[tool.ruff.lint.isort]
known-first-party = ["trinetra"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build hostile and malformed inputs.
"tests/**" = [
    "S101", "S104", "S105", "S106", "S108", "S301", "S603", "S607",  # assert, bind-host negatives, fake secrets, pickle, subprocess
    "ARG001", "ARG002", "N802", "N818",                     # fixtures/params, test-local exception names
    "RUF001", "RUF002", "RUF003",                           # intentional look-alike / non-ASCII characters
    "DTZ001",                                               # naive datetimes are negative test inputs
    "PT011", "PT012", "PT018",                              # style rules that fight table-driven negatives
    "PLC0415", "TRY301", "PERF401",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src/trinetra"]
warn_unreachable = true
# "redundant-expr" is deliberately NOT enabled: boundary validators reject `bool` where `int` is
# expected (`isinstance(x, bool) or not isinstance(x, int)`), which is correct at runtime because
# bool subclasses int, but statically redundant for mypy.
enable_error_code = ["ignore-without-code", "truthy-bool"]
show_error_codes = true
pretty = false

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "network: needs real network access; runs only when TRINETRA_NETWORK_TESTS=1 (never in default runs)",
]
