# Runs the IMP-0014 quality runner (scripts/quality_gate.py) on clean checkouts.
# Scoped amendment: this is NOT a retroactive acceptance of IMP-0014 and a green run
# is author-side evidence only. No secrets, no telemetry, read-only token.
name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked environment (build-time network only)
        run: uv sync --frozen
        timeout-minutes: 8
      - name: Quality gate
        run: uv run python scripts/quality_gate.py --json | tee quality-gate-report.json
        timeout-minutes: 12
